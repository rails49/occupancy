# ====================================================================================
# Classifier parameters (syncs to config.json during model export)
# ====================================================================================
classifier:
  # NOTE: `labels` was deleted rather than corrected. It advertised a four-tag
  # CNN vocabulary (coupling/other/track/train) that v4 cannot produce — every
  # crop derivable from a car span earns the same tag — and nothing could
  # verify it. See SPEC.md § v4 cannot produce a trainable CNN dataset.
  # Square pixel crop size for the ONNX classifier input (standard shoelace/Vite crop)
  crop_size: 96
  # Normalization values (ImageNet defaults)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ====================================================================================
# CNN Training hyperparameters (Python/Fastai)
# ====================================================================================
cnn:
  # Target patch crop size for training (1.5 * CROP_SIZE) to support translation jitter
  crop_size_prep: 144
  # Target Dots Per Track (DPT) resolution mapping
  sample_dpt: 20
  # Validation set split ratio
  val_split: 0.2
  # Batch size for training
  default_batch_size: 32
  # Number of training epochs
  default_num_epochs: 5
  # Optimizer learning rate
  learning_rate: 0.0001

# ====================================================================================
# Layout & Physical specifications (R49 manifest)
# ====================================================================================
# The standard gauge and the scale-to-ratio table are the .r49 format's, not this
# project's: the generator reads them from @rails49/r49's data file (ADR 0018,
# #181). The generator fails if either reappears here.
layout:
  # Prototype mm — widest real stock (SBB RAm TEE I). Car width is derived from
  # this rather than stored per label; because width in pixels is
  # DPT * standard_width / standard_gauge, the scale ratio cancels and a car is
  # 2.09 track-widths wide in every scale. Chosen widest rather than typical:
  # an over-wide box biases toward `occupied`, the direction the occupancy
  # output deliberately errs in. See SPEC.md § Location Data.
  standard_width: 3000.0
  # Below this a car is too few pixels across to localize reliably. Warns
  # persistently, never blocks — the fixture corpus lives at DPT 18-19. Under
  # `layout` and not `classifier` because it gates the editor.
  min_dpt: 20

# ====================================================================================
# Detector parameters (YOLO26n-OBB)
# ====================================================================================
detector:
  # 640x384 is a live fallback, not a closed door
  input: [960, 544]
  # Placeholder — needs held-out recall, which no protocol yet measures.
  # It has a floor above zero: at 0 you accept 300 padding slots as phantom
  # cars and every sensor reads `occupied` on every frame.
  confidence_threshold: 0.25
  # Rotated-box IoU above which two detections are taken to be the same car,
  # and the lower-scoring one dropped (issue #107).
  #
  # The exported graph does **not** deduplicate. `end2end`'s `TopK` selects the
  # 300 highest-scoring slots; it suppresses nothing, and measurement across the
  # fixture corpus found 130 boxes over 87 distinct vehicles at fp32 and 139
  # over 89 at INT8 — up to four boxes on one car. Quantization is not the
  # cause; the premise that the head deduplicates was simply wrong.
  #
  # 0.5, not Ultralytics' predict-time 0.7: coupled cars **abut** rather than
  # overlap, so a consist's neighbours score near zero against each other and
  # are never at risk, which buys room to suppress harder than a general-purpose
  # default would. Raise it if a real overlap ever gets eaten; the failure that
  # would show is a car vanishing from a tight curve where two boxes genuinely
  # overlap.
  nms_iou: 0.5
  # Fraction of exported images held out as the validation split. The split is
  # by image, not by label — every car in an image must land on the same side,
  # or the same frame appears in both. Deterministic in the image's identity,
  # so re-exporting reshuffles nothing.
  #
  # Its own key rather than a reuse of `cnn.val_split`: the two derivations
  # split different units (crops there, images here) and nothing requires the
  # ratios to move together.
  val_split: 0.2
  #
  # ⚠️  APPEND-ONLY. A list position *is* a YOLO class index, so reordering or
  # deleting an entry invalidates trained weights while this file still
  # validates. It is the one config edit that can break a model with nothing
  # noticing. The generator must not sort, dedupe, or reorder it.
  #
  # A label maps to the longest entry that is a segment-prefix of its class, so
  # `stock` matches `stock.loco.steam` but never `stockyard`. Adding a subtype
  # here therefore re-maps every already-labeled car of that subtype with no
  # relabeling.
  classes: ["stock"]
  #
  # Every entry must name a class in the vocabulary — the authoring taxonomy,
  # which is the .r49 format's and lives in @rails49/r49's data file (ADR 0018). The
  # generator fails, naming the class, when one does not: a class no label can
  # carry is an index nothing is ever trained as.
  #
  # The vocabulary's rules, kept here because JSON carries no comments:
  #
  # * The root (`stock`) is required rather than cosmetic — a new car is
  #   `stock` and refinements must roll up to it, so an unrooted class would
  #   match no entry above and be dropped from the export. The root never
  #   appears in the UI; the menu renders its children.
  # * A nested mapping is a subtype; any other value is a property of the class
  #   it sits under (`width_mm` is the one such property, an optional per-class
  #   width override). That is how a property is told from a subtype without a
  #   reserved list of key names.
  # * Adding a subtype there costs nothing downstream: `stock.loco.steam` still
  #   maps to `stock` until `stock.loco.steam` is appended here.
