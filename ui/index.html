<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railroad Occupancy UI</title>
    
    <style>
      :root {
        --rr-main-header-height: 60px;
      }
      /* The page under the app, which is work pane rather than chrome, so it
         follows the theme rather than keeping one value. */
      body {
        margin: 0;
        padding: 0;
        font-family: var(--sl-font-sans);
        background: var(--sl-color-neutral-0);
        color: var(--sl-color-neutral-900);
        height: 100vh;
        overflow: hidden;
      }

      /* Global scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--sl-color-neutral-100);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sl-color-neutral-300);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--sl-color-neutral-400);
      }
    </style>
  </head>
  <body>
    <rr-app></rr-app>
    <script type="module" src="/src/rr-app.ts"></script>
  </body>
</html>
