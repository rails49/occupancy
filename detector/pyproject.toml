[project]
name = "detector"
version = "0.1.0"
description = "YOLO26n-OBB rolling-stock detector: fine-tune, export, quantize."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Bernhard Boser", email = "bernhard.e.boser@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "onnxruntime>=1.25.1",
    "numpy>=2.4.4",
    "ultralytics>=8.4.115",
    "onnx>=1.16.0",
    # Declared, not left to Ultralytics' `requirements: AutoUpdate`, which pip
    # installs it into the venv mid-export when `simplify=True` — a self-
    # modifying environment that uv.lock does not describe.
    "onnxslim>=0.1.95",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pyright>=1.1.385",
    "pytest>=8.0.0",
    "ruff>=0.4.10",
]

[tool.pytest.ini_options]
# `letterbox.py` sits at the project root beside `export_onnx.py`, which imports
# it the same way. There is no package to install here — this is a two-script
# project — so the root goes on the path explicitly.
pythonpath = ["."]
testpaths = ["tests"]
