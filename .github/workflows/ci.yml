# The gate on `main`. `bin/test.sh` also runs from a pre-push hook, which is
# installed by hand (`bin/install-hooks.sh`) and skippable with `--no-verify`.
# The hook is faster feedback and catches most things before they reach `main`;
# this is the gate that cannot be skipped.
name: test

on:
  push:
    branches: [main]
  pull_request:

# `push` is scoped to `main` and pull_request covers the rest, so a branch with
# an open PR gets one run, not two. Superseded runs on a branch are cancelled;
# runs on `main` are always left to finish.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input — pnpm's version comes from `packageManager` in the
      # root package.json, and Node's from .nvmrc.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # For the `bin/*.py` checks. No `version:` input: the versions that
      # decide whether the gate is green are the tool versions pinned in
      # `bin/test.sh`.
      - uses: astral-sh/setup-uv@v10

      - run: pnpm install --frozen-lockfile

      # The same script the pre-push hook runs, unexpanded, so the two gates
      # cannot drift apart.
      - run: bin/test.sh
