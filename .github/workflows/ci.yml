# The gate on `main`. Until now the only gate was `bin/test.sh` run from a
# pre-push hook, which is installed by hand (`bin/install-hooks.sh`) and
# skippable with `--no-verify`. That was fine while this repo's `main` was its
# own only consumer. The corpus repo (rails49/r49) changed it: its CI checks out
# `rails49` at `main` and runs the validator from there, so a bad push here
# reddens a *contributor's* pull request with nothing on their side at fault.
#
# The pre-push hook stays. It is faster feedback and catches most things before
# they reach `main`; this is the gate that cannot be skipped. They are also not
# redundant — see the Python note on the `bin/test.sh` step below.
name: test

on:
  push:
    branches: [main]
  pull_request:

# `push` is scoped to `main` and pull_request covers the rest, so a branch with
# an open PR gets one run, not two. Superseded runs on a branch are cancelled;
# runs on `main` are always left to finish, because `main` is the ref the corpus
# repo checks out and its status is the thing contributors see.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input — pnpm's version comes from `packageManager` in the
      # root package.json, and Node's from .nvmrc. Those two files are the
      # toolchain declaration the corpus workflow also reads out of this
      # checkout, so this job consuming them is what keeps them honest.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `bin/test.sh` hard-fails without uv, deliberately: regenerating
      # lib/config and diffing it is the one check it will not degrade to a
      # warning. Python's own version comes from classifier/resnet/.python-version.
      #
      # Pinned to an exact version, unlike the actions above: setup-uv publishes
      # no floating major tag, so `@v9` does not resolve. Bump it by hand.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      # The same script the pre-push hook runs, unexpanded, so the two gates
      # cannot drift apart.
      #
      # This is stricter than a local run on macOS x86_64, where `uv sync`
      # cannot resolve the environment (no onnxruntime wheel) and `bin/test.sh`
      # skips the Python checks with a warning. On Linux they resolve, so ruff,
      # black and pyright actually run here — for some contributors, only here.
      - run: bin/test.sh
